name: Standalone artifact acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Verify retained paper and reproduce analyses
        run: |
          uv sync --frozen --group analysis
          uv run python scripts/verify_paper.py
          uv run --group analysis python analysis/specificity_analysis.py --output .reproduction/specificity
          uv run python analysis/split_half_analysis.py --output .reproduction/splits
          uv run --group analysis python analysis/verify_bootstrap.py --analysis .reproduction/specificity --output .reproduction/bootstrap-verification.json
          uv run python scripts/verify_paper.py --reproduced .reproduction/specificity --splits .reproduction/splits
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended
      - name: Compile unchanged manuscript
        working-directory: paper
        run: |
          mkdir -p ../.reproduction/paper
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=../.reproduction/paper main.tex
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=../.reproduction/paper main.tex
      - name: Preserve manuscript and numerical verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .reproduction/
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/acceptance
        with:
          source: .
